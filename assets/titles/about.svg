<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" fill="none" role="img" aria-label="About Me">
  <title>About Me</title>
  <style>
  .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Ubuntu, 'Helvetica Neue', Arial, sans-serif, 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji'; }
  .emoji { font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, Menlo, 'Liberation Mono', monospace; }
.ln { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.6s ease-out .2s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }</style>
  <defs>
      <linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
      <linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0891b2" stop-opacity=".7"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></linearGradient></defs>

  <rect x="0" y="16" width="48" height="40" rx="12" fill="#6366f1" fill-opacity=".12" stroke="#6366f1" stroke-opacity=".5"/>
  <text x="24" y="42" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#6366f1">01</text>
  <text x="64" y="48" class="sans" font-size="34" font-weight="800" letter-spacing="-.5" fill="url(#t)">About Me</text>
  <path class="ln" d="M243.3 37H1200" stroke="url(#l)" stroke-width="2" stroke-linecap="round"/>

