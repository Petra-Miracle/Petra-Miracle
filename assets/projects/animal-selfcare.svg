<svg xmlns="http://www.w3.org/2000/svg" width="540" height="250" viewBox="0 0 540 250" fill="none" role="img" aria-label="Animal SelfCare — Report &amp; rescue platform for stray animals — live reports, status tracking, and a responder workflow.">
  <title>Animal SelfCare — Report &amp; rescue platform for stray animals — live reports, status tracking, and a responder workflow.</title>
  <style>
  .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Ubuntu, 'Helvetica Neue', Arial, sans-serif, 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji'; }
  .emoji { font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, Menlo, 'Liberation Mono', monospace; }
.glow { animation: breathe 5s ease-in-out infinite; }
      .arrow { animation: nudge 2.4s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes nudge { 0%,100% { transform: translate(0,0); } 50% { transform: translate(2px,-2px); } }</style>
  <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111830"/><stop offset="1" stop-color="#0a0f22"/></linearGradient>
      <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b" stop-opacity=".75"/><stop offset=".45" stop-color="#1f2a4d"/><stop offset="1" stop-color="#1f2a4d"/></linearGradient>
      <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="40"/></filter>
      <clipPath id="clip"><rect width="540" height="250" rx="20"/></clipPath></defs>

  <g clip-path="url(#clip)">
    <rect width="540" height="250" fill="url(#bg)"/>
    <circle class="glow" cx="500" cy="0" r="110" fill="#f59e0b" fill-opacity=".28" filter="url(#blur)"/>
  </g>
  <rect x=".75" y=".75" width="538.5" height="248.5" rx="19.25" stroke="url(#edge)" stroke-width="1.5"/>
  <rect x="26" y="26" width="52" height="52" rx="14" fill="#f59e0b" fill-opacity=".14" stroke="#f59e0b" stroke-opacity=".5"/>
  <g transform="translate(39 39) scale(1.0833)" stroke="#f59e0b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></g>
  <text x="94" y="50" class="sans" font-size="22" font-weight="700" fill="#f8fafc">Animal SelfCare</text>
  <text x="94" y="72" class="mono" font-size="12" letter-spacing=".8" fill="#f59e0b">CIVIC-TECH · REPORTING</text>
  <g class="arrow"><path d="M494 54 L508 40 M497 40 H508 V51" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="26" y="114" class="sans" font-size="15" fill="#a5b4c8">Report &amp; rescue platform for stray animals — live reports, status</text>
  <text x="26" y="136" class="sans" font-size="15" fill="#a5b4c8">tracking, and a responder workflow.</text>
  <text x="26" y="184" class="sans" font-size="13" font-weight="600" fill="#e2e8f0" fill-opacity=".85">⚡ REST + Server-Sent Events</text>
  <g transform="translate(26 200)">
    <rect width="106" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#1f2a4d"/>
    <circle cx="14" cy="13" r="4" fill="#3178c6"/>
    <text x="24" y="17.32" class="mono" font-size="12" fill="#cbd5e1">TypeScript</text>
  </g><g transform="translate(140 200)">
    <rect width="70" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#1f2a4d"/>
    <circle cx="14" cy="13" r="4" fill="#61dafb"/>
    <text x="24" y="17.32" class="mono" font-size="12" fill="#cbd5e1">React</text>
  </g><g transform="translate(218 200)">
    <rect width="56" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#1f2a4d"/>
    <circle cx="14" cy="13" r="4" fill="#0ea5e9"/>
    <text x="24" y="17.32" class="mono" font-size="12" fill="#cbd5e1">SSE</text>
  </g>

</svg>
