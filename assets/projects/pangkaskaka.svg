    <rect width="84" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#1f2a4d"/>
    <circle cx="14" cy="13" r="4" fill="#f8fafc"/>
    <text x="24" y="17.32" class="mono" font-size="12" fill="#cbd5e1">Next.js</text>
  </g><g transform="translate(118 200)">
