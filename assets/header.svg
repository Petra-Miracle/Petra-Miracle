<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-label="Petra Miracle — Full-Stack Developer, Web &amp; Mobile">
  <title>Petra Miracle — Full-Stack Developer, Web &amp; Mobile</title>
  <style>
  .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Ubuntu, 'Helvetica Neue', Arial, sans-serif, 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji'; }
  .emoji { font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, Menlo, 'Liberation Mono', monospace; }

      .ln { opacity: 0; animation: up .5s ease-out forwards; }
      .in { opacity: 0; animation: up .8s cubic-bezier(.2,.7,.2,1) forwards; }
      .kw { fill: #c084fc; } .var { fill: #7dd3fc; } .p { fill: #cbd5e1; } .str { fill: #86efac; } .cm { fill: #64748b; font-style: italic; }
      .orb1 { animation: drift1 14s ease-in-out infinite; }
      .orb2 { animation: drift2 18s ease-in-out infinite; }
      .orb3 { animation: drift1 22s ease-in-out infinite reverse; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
      .caret { animation: blink 1s steps(1) infinite; }
      .shine { animation: shine 6s ease-in-out infinite; }
      .win { animation: float 7s ease-in-out infinite; }
      @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px,30px); } }
      @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-70px,-25px); } }
      @keyframes pulse { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(3); opacity: 0; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes shine { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    </style>
  <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#070b18"/><stop offset=".55" stop-color="#0d1330"/><stop offset="1" stop-color="#071526"/>
      </linearGradient>
      <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#c7d2fe"/><stop offset="1" stop-color="#67e8f9"/>
      </linearGradient>
      <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#6366f1" stop-opacity=".9"/><stop offset=".5" stop-color="#6366f1" stop-opacity=".1"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".8"/>
      </linearGradient>
      <linearGradient id="winEdge" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
      </linearGradient>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M40 0H0V40" stroke="#94a3b8" stroke-opacity=".08"/>
      </pattern>
      <radialGradient id="gridFade" cx=".5" cy=".4" r=".7">
        <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <mask id="gridMask"><rect width="1200" height="420" fill="url(#gridFade)"/></mask>
      <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="70"/></filter>
      <clipPath id="clip"><rect width="1200" height="420" rx="28"/></clipPath>
    </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="orb1" cx="220" cy="80" r="170" fill="#6366f1" fill-opacity=".45"/>
      <circle class="orb2" cx="1020" cy="360" r="190" fill="#06b6d4" fill-opacity=".32"/>
      <circle class="orb3" cx="700" cy="40" r="120" fill="#a855f7" fill-opacity=".25"/>
    </g>
    <rect width="1200" height="420" fill="url(#grid)" mask="url(#gridMask)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="419" rx="27.5" stroke="url(#edge)" class="shine"/>

  <g class="in" style="animation-delay:.1s">
    <rect x="64" y="70" width="268" height="34" rx="17" fill="#10b981" fill-opacity=".1" stroke="#10b981" stroke-opacity=".45"/>
    <circle class="pulse" cx="84" cy="87" r="5" fill="#34d399"/>
    <circle cx="84" cy="87" r="5" fill="#34d399"/>
    <text x="98" y="92" class="sans" font-size="14" font-weight="600" fill="#a7f3d0">Available for freelance &amp; collab</text>
  </g>
  <text x="64" y="156" class="sans in" font-size="24" fill="#94a3b8" style="animation-delay:.25s">Hi there 👋, I'm</text>
  <text x="60" y="230" class="sans in" font-size="72" font-weight="800" letter-spacing="-2" fill="url(#name)" style="animation-delay:.4s">Petra Miracle</text>
  <text x="64" y="276" class="sans in" font-size="24" fill="#cbd5e1" style="animation-delay:.55s">Full-Stack Developer <tspan fill="#818cf8">·</tspan> Web &amp; Mobile</text>
  <g class="in" style="animation-delay:.7s"><g transform="translate(0 312)"><g transform="translate(64 0)">
    <rect width="57" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#1f2a4d"/>
    <circle cx="14" cy="15" r="4" fill="#818cf8"/>
    <text x="24" y="19.68" class="mono" font-size="13" fill="#cbd5e1">Web</text>
  </g><g transform="translate(131 0)">
    <rect width="81" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#1f2a4d"/>
    <circle cx="14" cy="15" r="4" fill="#ec4899"/>
    <text x="24" y="19.68" class="mono" font-size="13" fill="#cbd5e1">Mobile</text>
  </g><g transform="translate(222 0)">
    <rect width="104" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#1f2a4d"/>
    <circle cx="14" cy="15" r="4" fill="#22d3ee"/>
    <text x="24" y="19.68" class="mono" font-size="13" fill="#cbd5e1">Real-time</text>
  </g><g transform="translate(336 0)">
    <rect width="73" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#1f2a4d"/>
    <circle cx="14" cy="15" r="4" fill="#f59e0b"/>
    <text x="24" y="19.68" class="mono" font-size="13" fill="#cbd5e1">MLOps</text>
  </g></g></g>

  <g class="in" style="animation-delay:.5s"><g class="win">
    <rect x="668" y="78" width="476" height="270" rx="18" fill="#0b1124" fill-opacity=".78" stroke="url(#winEdge)"/>
    <path d="M668 124H1144" stroke="#ffffff" stroke-opacity=".07"/>
    <circle cx="692" cy="101" r="6" fill="#ff5f57"/>
    <circle cx="712" cy="101" r="6" fill="#febc2e"/>
    <circle cx="732" cy="101" r="6" fill="#28c840"/>
    <text x="906" y="106" text-anchor="middle" class="mono" font-size="12" fill="#64748b">petra.ts</text>
    <text x="694" y="156" class="mono ln" xml:space="preserve" font-size="13.5" style="animation-delay:0.90s"><tspan class="kw">const </tspan><tspan class="var">petra</tspan><tspan class="p"> = {</tspan></text>
    <text x="694" y="176" class="mono ln" xml:space="preserve" font-size="13.5" style="animation-delay:1.02s"><tspan class="p">  role: </tspan><tspan class="str">&quot;Full-Stack Developer&quot;</tspan><tspan class="p">,</tspan></text>
    <text x="694" y="196" class="mono ln" xml:space="preserve" font-size="13.5" style="animation-delay:1.14s"><tspan class="p">  stack: [</tspan><tspan class="str">&quot;React&quot;</tspan><tspan class="p">, </tspan><tspan class="str">&quot;Next.js&quot;</tspan><tspan class="p">, </tspan><tspan class="str">&quot;Flutter&quot;</tspan><tspan class="p">],</tspan></text>
    <text x="694" y="216" class="mono ln" xml:space="preserve" font-size="13.5" style="animation-delay:1.26s"><tspan class="p">  backend: [</tspan><tspan class="str">&quot;Express&quot;</tspan><tspan class="p">, </tspan><tspan class="str">&quot;Prisma&quot;</tspan><tspan class="p">],</tspan></text>
    <text x="694" y="236" class="mono ln" xml:space="preserve" font-size="13.5" style="animation-delay:1.38s"><tspan class="p">  exploring: [</tspan><tspan class="str">&quot;MLOps&quot;</tspan><tspan class="p">, </tspan><tspan class="str">&quot;PostGIS&quot;</tspan><tspan class="p">],</tspan></text>
    <text x="694" y="256" class="mono ln" xml:space="preserve" font-size="13.5" style="animation-delay:1.50s"><tspan class="p">  openToWork: </tspan><tspan class="kw">true</tspan><tspan class="p">,</tspan></text>
    <text x="694" y="276" class="mono ln" xml:space="preserve" font-size="13.5" style="animation-delay:1.62s"><tspan class="p">};</tspan></text>
    <text x="694" y="296" class="mono ln" xml:space="preserve" font-size="13.5" style="animation-delay:1.74s"></text>
    <text x="694" y="316" class="mono ln" xml:space="preserve" font-size="13.5" style="animation-delay:1.86s"><tspan class="cm">// Ship fast, keep it clean,</tspan></text>
    <text x="694" y="336" class="mono ln" xml:space="preserve" font-size="13.5" style="animation-delay:1.98s"><tspan class="cm">// build what people actually use.</tspan></text>
    <rect class="caret" x="971.4" y="323" width="8" height="16" rx="1.5" fill="#22d3ee"/>
  </g></g>

</svg>
