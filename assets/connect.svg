<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" fill="none" role="img" aria-label="Let's build something great together">
  <title>Let's build something great together</title>
  <style>
  .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Ubuntu, 'Helvetica Neue', Arial, sans-serif, 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji'; }
  .emoji { font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, Menlo, 'Liberation Mono', monospace; }
.orb1 { animation: drift 12s ease-in-out infinite; } .orb2 { animation: drift 15s ease-in-out infinite reverse; }
      @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(80px,10px); } }</style>
  <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1330"/><stop offset="1" stop-color="#070b18"/></linearGradient>
      <linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a5f3fc"/></linearGradient>
      <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
      <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="60"/></filter>
      <clipPath id="clip"><rect width="1200" height="210" rx="24"/></clipPath></defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="210" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="orb1" cx="200" cy="200" r="150" fill="#6366f1" fill-opacity=".5"/>
      <circle class="orb2" cx="1000" cy="0" r="150" fill="#06b6d4" fill-opacity=".4"/>
    </g>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="208.5" rx="23.25" stroke="url(#edge)" stroke-opacity=".6" stroke-width="1.5"/>
  <text x="600" y="92" text-anchor="middle" class="sans" font-size="40" font-weight="800" letter-spacing="-1" fill="url(#t)">Have an idea? Let's build it together.</text>
  <text x="600" y="134" text-anchor="middle" class="sans" font-size="19" fill="#cbd5e1">Open for freelance projects, collaborations &amp; full-time opportunities.</text>
  <text x="600" y="172" text-anchor="middle" class="mono" font-size="14" fill="#22d3ee">→ reach out through any of the links below</text>

</svg>
